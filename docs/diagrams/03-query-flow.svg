<path d="M910.0,694.0 L910.0,720.0 L770.0,720.0 L770.0,744.0" fill="none" stroke="#93A2B7" stroke-width="1.7" stroke-linejoin="miter" stroke-linecap="butt" marker-end="url(#soft)"/>
<rect x="310.0" y="906.0" width="620.0" height="96.0" fill="#FEF8EC" stroke="#EBD2A6" stroke-width="1.4" filter="url(#lift)"/><rect x="310.0" y="906.0" width="4" height="96.0" fill="#B0740E"/><text x="328.0" y="927.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#96630C" text-anchor="start" letter-spacing="1.1">STEP 5</text><text x="328.0" y="948.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0B1220" text-anchor="start">ChatGroq(model).stream()</text><text x="328.0" y="967.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="10.4" font-weight="400" fill="#6B7A90" text-anchor="start">Chunks arrive as they are produced</text>
<rect x="310.0" y="1042.0" width="620.0" height="96.0" fill="#F2F6FE" stroke="#B9CBF0" stroke-width="1.4" filter="url(#lift)"/><rect x="310.0" y="1042.0" width="4" height="96.0" fill="#2557D6"/><text x="328.0" y="1063.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2557D6" text-anchor="start" letter-spacing="1.1">STEP 6</text><text x="328.0" y="1084.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0B1220" text-anchor="start">st.write_stream, then AIMessage</text><text x="328.0" y="1103.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6B7A90" text-anchor="start">Rendered live, then appended to chat_history</text>
