<polygon points="620.0,284.0 785.0,336.0 620.0,388.0 455.0,336.0" fill="#FEF8EC" stroke="#D8A44C" stroke-width="1.5" filter="url(#lift)"/><text x="620.0" y="335.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.2" font-weight="600" fill="#0B1220" text-anchor="middle">Is a FAISS index loaded?</text><text x="620.0" y="351.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.4" font-weight="400" fill="#8A6316" text-anchor="middle">st.session_state.database</text>
