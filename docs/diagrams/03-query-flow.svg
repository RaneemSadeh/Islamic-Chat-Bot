<rect x="358.6" y="309.9" width="90.8" height="20.2" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="404.0" y="323.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#0B1220" text-anchor="middle">yes - grounded</text>
<path d="M785.0,336.0 L910.0,336.0 L910.0,410.0" fill="none" stroke="#93A2B7" stroke-width="1.7" stroke-linejoin="miter" stroke-linecap="butt" marker-end="url(#soft)"/>
<rect x="789.3" y="309.9" width="85.3" height="20.2" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="832.0" y="323.7" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#0B1220" text-anchor="middle">no - fallback</text>
<rect x="60.0" y="410.0" width="540.0" height="122.0" fill="#EFFBF5" stroke="#A8DCCB" stroke-width="1.4" filter="url(#lift)"/><rect x="60.0" y="410.0" width="4" height="122.0" fill="#0E8F6E"/><text x="78.0" y="431.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#0B7A5E" text-anchor="start" letter-spacing="1.1">STEP 2A</text><text x="78.0" y="452.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0B1220" text-anchor="start">Retrieve nearest chunks</text><text x="78.0" y="471.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="10.4" font-weight="400" fill="#6B7A90" text-anchor="start">database.similarity_search(question, k=3)</text><text x="78.0" y="485.5" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="10.4" font-weight="400" fill="#6B7A90" text-anchor="start">returns three Documents with metadata</text>
<rect x="60.0" y="572.0" width="540.0" height="122.0" fill="#0B1220" stroke="#0B1220" stroke-width="1.4" filter="url(#lift)"/><rect x="60.0" y="572.0" width="4" height="122.0" fill="#38BDF8"/><text x="78.0" y="593.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#7DD3FC" text-anchor="start" letter-spacing="1.1">STEP 3A</text><text x="78.0" y="614.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="start">Assemble the context slot</text><text x="78.0" y="633.0" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="10.4" font-weight="400" fill="#AEBCCE" text-anchor="start">[doc.page_content for doc in search_docs]</text><text x="78.0" y="647.5" font-family="'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace" font-size="10.4" font-weight="400" fill="#AEBCCE" text-anchor="start">joined verbatim - no re-ranking, no dedupe</text>
<rect x="640.0" y="410.0" width="540.0" height="122.0" fill="#FEF4F3" stroke="#EFC0BC" stroke-width="1.4" filter="url(#lift)"/><rect x="640.0" y="410.0" width="4" height="122.0" fill="#C0392B"/><text x="658.0" y="431.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#B03225" text-anchor="start" letter-spacing="1.1">STEP 2B</text><text x="658.0" y="452.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0B1220" text-anchor="start">No passages to cite</text><text x="658.0" y="471.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6B7A90" text-anchor="start">The chain answers from model memory alone.</text><text x="658.0" y="485.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6B7A90" text-anchor="start">Nothing in the reply can be traced to a source.</text>
<rect x="640.0" y="572.0" width="540.0" height="122.0" fill="#F7F9FC" stroke="#D7DEE9" stroke-width="1.4" filter="url(#lift)"/><rect x="640.0" y="572.0" width="4" height="122.0" fill="#7C8CA3"/><text x="658.0" y="593.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#7C8CA3" text-anchor="start" letter-spacing="1.1">STEP 3B</text><text x="658.0" y="614.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0B1220" text-anchor="start">Plain assistant prompt</text><text x="658.0" y="633.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6B7A90" text-anchor="start">chat_history and user_question only -</text><text x="658.0" y="647.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6B7A90" text-anchor="start">the context slot is left out of the template.</text>
