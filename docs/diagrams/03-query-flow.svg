<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1232" viewBox="0 0 1240 1232" role="img" aria-label="Query and answer flow">
<title>Query and answer flow</title>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="#57647A"/></marker>
<marker id="head-back" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="#57647A"/></marker>
<marker id="soft" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="#93A2B7"/></marker>
<marker id="soft-back" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L9.5,5 L0.5,9.2 z" fill="#93A2B7"/></marker>
