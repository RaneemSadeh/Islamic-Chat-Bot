<path d="M910.0,532.0 L910.0,572.0" fill="none" stroke="#93A2B7" stroke-width="1.7" stroke-linejoin="miter" stroke-linecap="butt" marker-end="url(#soft)"/>
<rect x="310.0" y="744.0" width="620.0" height="118.0" fill="#0B1220" stroke="#0B1220" stroke-width="1.4" filter="url(#lift)"/><rect x="310.0" y="744.0" width="4" height="118.0" fill="#38BDF8"/><text x="328.0" y="765.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#7DD3FC" text-anchor="start" letter-spacing="1.1">STEP 4</text><text x="328.0" y="786.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="start">ChatPromptTemplate</text><text x="328.0" y="805.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#AEBCCE" text-anchor="start">Slots: context, chat_history, user_question</text><text x="328.0" y="819.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#AEBCCE" text-anchor="start">Instruction: answer from the context, say so when it is silent</text>
