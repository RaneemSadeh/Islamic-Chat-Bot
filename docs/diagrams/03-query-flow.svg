</defs>
<rect width="1240" height="1232" fill="#FFFFFF"/>
<rect width="1240" height="1232" fill="url(#grid)"/>
<rect x="0.75" y="0.75" width="1238.5" height="1230.5" fill="none" stroke="#D3DBE6" stroke-width="1.5"/>
<rect x="0" y="0" width="1240" height="4" fill="#0E8F6E"/>
<text x="40.0" y="47.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#0E8F6E" text-anchor="start" letter-spacing="1.1">SIRAJ - ISLAMIC RAG CHATBOT</text>
<text x="40.0" y="76.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B1220" text-anchor="start">Query and answer flow</text>
<text x="40.0" y="97.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.4" font-weight="400" fill="#6B7A90" text-anchor="start">One turn through the RAG console, including the ungrounded fallback path.</text>
<rect x="310.0" y="152.0" width="620.0" height="96.0" fill="#F2F6FE" stroke="#B9CBF0" stroke-width="1.4" filter="url(#lift)"/><rect x="310.0" y="152.0" width="4" height="96.0" fill="#2557D6"/><text x="328.0" y="173.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#2557D6" text-anchor="start" letter-spacing="1.1">TURN STARTS</text><text x="328.0" y="194.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0B1220" text-anchor="start">Question typed in the chat box</text><text x="328.0" y="213.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.2" font-weight="400" fill="#6B7A90" text-anchor="start">st.chat_input, appended to history as a HumanMessage</text>
