<rect x="60.0" y="594.0" width="1400.0" height="76.0" fill="#F7F9FC" stroke="#D7DEE9" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="60.0" y="594.0" width="3" height="76.0" fill="#7C8CA3"/><text x="76.0" y="618.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#7C8CA3" text-anchor="start" letter-spacing="1.1">TWO THINGS WORTH KNOWING</text><text x="76.0" y="638.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7A90" text-anchor="start">Chunk settings only take effect on the next build - moving a slider after the index exists changes nothing until Create Database is pressed again.</text><text x="76.0" y="653.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7A90" text-anchor="start">Arabic text is split on characters, not tokens, so a 500-character chunk holds roughly 120-160 Arabic words. Short chunks sharpen retrieval and blunt context; long chunks do the opposite.</text>
