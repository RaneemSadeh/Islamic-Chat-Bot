name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

  diagrams:
    name: Diagrams are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python docs/diagrams/generate_diagrams.py
      - name: Fail if the committed SVGs drifted from the generator
        run: git diff --exit-code -- docs/diagrams

  console:
    name: RAG console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q rag_console
